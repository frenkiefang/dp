<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#09090B">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <title>数据管理 — 积分看板</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'Menlo', 'Consolas', 'monospace'],
                    },
                }
            }
        }
    </script>

    <style>
        :root {
            color-scheme: light;
            --bg-primary: #F5F0E8;
            --bg-card: #F5F0E8;
            --bg-deeper: #EDE4D4;
            --border: #D4CFC6;
            --border-light: #BFBBB3;
            --text-primary: #2E2A24;
            --text-secondary: #4A4540;
            --text-muted: #8C8C8C;
            --ink-ghost: #BFBBB3;
            --accent: #0047AB;
            --font-body: 'Special Elite', 'LXGW WenKai Mono TC', 'Space Mono', monospace;
            --font-heading: 'Playfair Display SC', 'LXGW WenKai Mono TC', 'Noto Serif SC', serif;
            --font-mono: 'Special Elite', 'Space Mono', monospace;
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --bg-primary: #09090B;
            --bg-card: #18181B;
            --bg-deeper: #09090B;
            --border: #27272A;
            --border-light: #3F3F46;
            --text-primary: #FAFAFA;
            --text-secondary: #A1A1AA;
            --text-muted: #71717A;
            --ink-ghost: #52525B;
            --accent: #E0B034; /* Royal Gold */
            --font-body: 'Special Elite', 'LXGW WenKai Mono TC', 'Space Mono', monospace;
            --font-heading: 'Playfair Display SC', 'LXGW WenKai Mono TC', 'Noto Serif SC', serif;
            --font-mono: 'Special Elite', 'Space Mono', monospace;
        }

        * { -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%; overflow-x: hidden;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 0; height: 0; }
        body { scrollbar-width: none; }

        /* 修复窄屏手机下 input[type="date"] 横向溢出及 iOS Safari 样式缩进问题 */
        input[type="date"] {
            box-sizing: border-box !important;
            max-width: 100% !important;
            width: 100% !important;
            min-width: 0 !important;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="date"]::-webkit-date-and-time-value {
            text-align: left;
            min-height: 1.4em;
            margin: 0;
            padding: 0;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            padding: 0;
            margin-left: 4px;
        }

        .toast {
            position: fixed; top: 16px; left: 50%;
            transform: translateX(-50%) translateY(-120px);
            z-index: 100; padding: 12px 20px; border-radius: 12px;
            font-size: 14px; font-weight: 500; max-width: 380px; width: 90%; text-align: center;
            transition: transform 300ms cubic-bezier(0.32, 0.72, 0, 1);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: #0A2E1F; color: #A7F3D0; border: 1px solid #14532D; }
        .toast.error { background: #3B0A0A; color: #FECACA; border: 1px solid #7F1D1D; }

        /* ── Light theme overrides ── */
        [data-theme="light"] html::before {
            content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
        [data-theme="light"] html {
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.008) 2px, rgba(0,0,0,0.008) 4px), repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.005) 3px, rgba(0,0,0,0.005) 6px);
        }

        [data-theme="light"] .bg-zinc-900, [data-theme="light"] .bg-zinc-800 { background-color: var(--bg-card) !important; }
        [data-theme="light"] .bg-zinc-950 { background-color: var(--bg-deeper) !important; }
        [data-theme="light"] .border-zinc-800, [data-theme="light"] .border-zinc-700 { border-color: var(--border) !important; }
        [data-theme="light"] .text-zinc-100 { color: var(--text-primary) !important; }
        [data-theme="light"] .text-zinc-200, [data-theme="light"] .text-zinc-300, [data-theme="light"] .text-zinc-400 { color: var(--text-secondary) !important; }
        [data-theme="light"] .text-zinc-500 { color: var(--text-muted) !important; }
        [data-theme="light"] .text-zinc-600, [data-theme="light"] .text-zinc-700 { color: var(--ink-ghost) !important; }
        
        [data-theme="light"] input, [data-theme="light"] select {
            background-color: var(--bg-card) !important;
            border-color: var(--border) !important;
            color: var(--text-primary) !important;
        }
        [data-theme="light"] input:focus, [data-theme="light"] select:focus {
            border-color: var(--border-light) !important;
        }
        [data-theme="light"] button#login-btn, [data-theme="light"] button#submit-btn {
            background-color: var(--accent) !important;
            color: #FFFFFF !important;
        }
        [data-theme="light"] button#login-btn:hover, [data-theme="light"] button#submit-btn:hover {
            opacity: 0.95;
        }
        
        [data-theme="light"] .toast.success { background: rgba(0,71,171,0.08); color: #0047AB; border: 1px solid rgba(0,71,171,0.2); }
        [data-theme="light"] .toast.error { background: rgba(220,47,47,0.06); color: #DC2F2F; border: 1px solid rgba(220,47,47,0.2); }
        [data-theme="light"] .remove-row-btn:hover { background-color: rgba(220, 47, 47, 0.06) !important; color: #DC2F2F !important; }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <main class="w-full max-w-lg px-4 pt-4 pb-8">

        <!-- Unified Header Bar -->
        <header class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-2">
                <a href="./index.html" class="flex items-center justify-center w-8 h-8 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-lg text-zinc-300 text-xs transition-colors" title="返回主页">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div>
                    <h1 class="text-lg font-semibold tracking-tight text-zinc-100 flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-zinc-500 text-sm"></i>数据管理
                    </h1>
                    <p class="text-xs text-zinc-500 mt-0.5">
                        <span id="login-user" class="text-zinc-400">管理员控制台</span>
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="theme-toggle" class="flex items-center gap-1 px-2.5 py-1.5 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-lg text-zinc-300 text-xs font-medium transition-colors" title="切换主题">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                </button>
                <button id="logout-btn" class="hidden flex items-center justify-center w-8 h-8 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 hover:border-red-950 rounded-lg text-zinc-400 hover:text-red-400 text-xs transition-all animate-fade-in" title="登出">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- ═══════════ LOGIN VIEW ═══════════ -->
        <div id="login-view">
            <div class="text-center mt-16 mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-zinc-800 mb-4">
                    <i class="fa-solid fa-lock text-2xl text-zinc-400"></i>
                </div>
                <h1 class="text-xl font-semibold text-zinc-100">管理员登录</h1>
                <p class="text-xs text-zinc-500 mt-1">登录后方可录入、编辑数据</p>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 max-w-sm mx-auto">
                <label class="text-xs text-zinc-500 block mb-1.5">邮箱</label>
                <input type="email" id="login-email" placeholder="admin@example.com"
                    class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-200 mb-4
                           focus:outline-none focus:border-zinc-600 transition-colors">

                <label class="text-xs text-zinc-500 block mb-1.5">密码</label>
                <input type="password" id="login-password" placeholder="········"
                    class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-200 mb-5
                           focus:outline-none focus:border-zinc-600 transition-colors">

                <button id="login-btn"
                    class="w-full py-3 bg-zinc-100 hover:bg-zinc-200 active:bg-zinc-300 text-zinc-900 rounded-xl text-sm font-semibold transition-colors">
                    <i class="fa-solid fa-right-to-bracket mr-1.5"></i>登录
                </button>
                <p id="login-error" class="text-xs text-red-400 text-center mt-3 hidden"></p>
            </div>

            <p class="text-xs text-zinc-600 text-center mt-6 max-w-sm mx-auto leading-relaxed">
                在 Supabase Dashboard → Authentication → Users 中创建管理员账号，然后用该邮箱和密码登录。
            </p>
        </div>

        <!-- ═══════════ ADMIN VIEW (hidden until login) ═══════════ -->
        <div id="admin-view" class="hidden">



            <!-- ── Entry Form ── -->
            <section class="mb-5">
                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4">
                    <p class="text-xs font-medium text-zinc-500 uppercase tracking-widest mb-4">
                        <i class="fa-solid fa-upload mr-1.5"></i>录入数据
                    </p>

                    <div class="mb-4 w-full min-w-0">
                        <label class="text-xs text-zinc-500 block mb-1.5">日期</label>
                        <input type="date" id="entry-date"
                            class="w-full max-w-full min-w-0 box-border bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-zinc-200
                                   focus:outline-none focus:border-zinc-600 transition-colors">
                    </div>

                    <div id="player-rows" class="space-y-2 mb-3"></div>

                    <div id="total-display" class="flex items-center justify-between bg-zinc-800/40 rounded-xl px-4 py-2.5 mb-3">
                        <span class="text-xs text-zinc-400"><i class="fa-solid fa-calculator mr-1.5"></i>选手积分合计</span>
                        <span id="total-value" class="font-mono text-sm font-semibold text-zinc-200">0分</span>
                    </div>

                    <button id="add-player-btn"
                        class="w-full py-2.5 border border-dashed border-zinc-700 rounded-xl text-xs text-zinc-500
                               hover:text-zinc-300 hover:border-zinc-500 active:bg-zinc-800 transition-all mb-4">
                        <i class="fa-solid fa-plus mr-1.5"></i>添加选手
                    </button>

                    <button id="submit-btn"
                        class="w-full py-3 bg-zinc-100 hover:bg-zinc-200 active:bg-zinc-300 text-zinc-900
                               rounded-xl text-sm font-semibold transition-colors">
                        <i class="fa-solid fa-check mr-1.5"></i>一键提交
                    </button>
                    <p id="submit-hint" class="text-xs text-zinc-600 text-center mt-2 hidden"></p>
                </div>
            </section>

            <!-- ── Recent Records ── -->
            <section class="mb-6">
                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
                    <div class="px-4 py-3.5 border-b border-zinc-800 flex items-center justify-between">
                        <p class="text-xs font-medium text-zinc-500 uppercase tracking-widest">
                            <i class="fa-solid fa-clock-rotate-left mr-1.5"></i>近期记录
                        </p>
                        <span id="record-count" class="text-xs text-zinc-600"></span>
                    </div>
                    <div id="records-loading" class="px-4 py-6 space-y-3">
                        <div class="h-12 rounded-lg bg-zinc-800/50 animate-pulse"></div>
                        <div class="h-12 rounded-lg bg-zinc-800/50 animate-pulse"></div>
                        <div class="h-12 rounded-lg bg-zinc-800/50 animate-pulse"></div>
                    </div>
                    <div id="records-empty" class="hidden px-4 py-10 text-center">
                        <i class="fa-regular fa-clipboard text-2xl text-zinc-700 mb-2 block"></i>
                        <p class="text-sm text-zinc-500">暂无记录</p>
                    </div>
                    <div id="records-list" class="hidden"></div>
                </div>
            </section>

            <footer class="text-center text-xs text-zinc-700 pb-4">
                Powered by Supabase · 积分看板
            </footer>
        </div>
    </main>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
    (function() {
        // ── CONFIG ──
        const SUPABASE_URL = 'https://bpippqhzpfmdcuwfswfr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Q2SQy1RS8vk5ek-rZJTCkA_qFcp1kl3';
        const TABLE_NAME = 'dp_database';

        // ── STATE ──
        let supabase = null;
        let allRecords = [];

        // ── DOM ──
        const $ = (sel) => document.querySelector(sel);
        const domLoginView = $('#login-view');
        const domAdminView = $('#admin-view');
        const domLoginEmail = $('#login-email');
        const domLoginPassword = $('#login-password');
        const domLoginBtn = $('#login-btn');
        const domLoginError = $('#login-error');
        const domLoginUser = $('#login-user');
        const domLogoutBtn = $('#logout-btn');
        const domEntryDate = $('#entry-date');
        const domPlayerRows = $('#player-rows');
        const domTotalValue = $('#total-value');
        const domAddPlayerBtn = $('#add-player-btn');
        const domSubmitBtn = $('#submit-btn');
        const domRecordsLoading = $('#records-loading');
        const domRecordsEmpty = $('#records-empty');
        const domRecordsList = $('#records-list');
        const domRecordCount = $('#record-count');
        const domToast = $('#toast');

        // ── Toast ──
        let toastTimer = null;
        function showToast(msg, type = 'success') {
            if (toastTimer) clearTimeout(toastTimer);
            domToast.className = `toast ${type}`;
            domToast.textContent = msg;
            void domToast.offsetWidth;
            domToast.classList.add('show');
            toastTimer = setTimeout(() => domToast.classList.remove('show'), 3000);
        }

        // ── Supabase Init ──
        function initSupabase() {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // ── Auth ──
        domLoginBtn.addEventListener('click', async () => {
            const email = domLoginEmail.value.trim();
            const password = domLoginPassword.value;
            if (!email || !password) {
                domLoginError.textContent = '请填写邮箱和密码';
                domLoginError.classList.remove('hidden');
                return;
            }

            domLoginBtn.disabled = true;
            domLoginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>登录中...';
            domLoginError.classList.add('hidden');

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            domLoginBtn.disabled = false;
            domLoginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-1.5"></i>登录';

            if (error) {
                domLoginError.textContent = error.message === 'Invalid login credentials'
                    ? '邮箱或密码错误'
                    : error.message;
                domLoginError.classList.remove('hidden');
                return;
            }

            showAdminView(data.user);
        });

        domLogoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            showLoginView();
        });

        function showLoginView() {
            domLoginView.classList.remove('hidden');
            domAdminView.classList.add('hidden');
            domLoginEmail.value = '';
            domLoginPassword.value = '';
            domLogoutBtn.classList.add('hidden');
            domLoginUser.textContent = '管理员控制台';
        }

        function showAdminView(user) {
            domLoginView.classList.add('hidden');
            domAdminView.classList.remove('hidden');
            domLoginUser.textContent = user.email;
            domLogoutBtn.classList.remove('hidden');
            initAdminPanel();
        }

        // ── Admin Panel Init ──
        async function initAdminPanel() {
            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            domEntryDate.value = `${y}-${m}-${d}`;

            // Default 6 empty rows
            domPlayerRows.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                domPlayerRows.appendChild(createPlayerRow());
            }

            domRecordsLoading.classList.remove('hidden');
            domRecordsEmpty.classList.add('hidden');
            domRecordsList.classList.add('hidden');

            await fetchRecords();
        }

        // ── Fetch Records ──
        async function fetchRecords() {
            try {
                const { data, error } = await supabase
                    .from(TABLE_NAME)
                    .select('*')
                    .order('play_date', { ascending: false })
                    .order('id', { ascending: false })
                    .limit(50);

                if (error) throw error;
                allRecords = data || [];
                renderRecords();
            } catch(e) {
                console.error(e);
                showToast('加载记录失败: ' + (e.message || '网络错误'), 'error');
                allRecords = [];
                renderRecords();
            }
        }

        function renderRecords() {
            domRecordsLoading.classList.add('hidden');

            if (allRecords.length === 0) {
                domRecordsEmpty.classList.remove('hidden');
                domRecordsList.classList.add('hidden');
                domRecordCount.textContent = '';
                return;
            }

            domRecordsEmpty.classList.add('hidden');
            domRecordsList.classList.remove('hidden');
            domRecordCount.textContent = `最近 ${allRecords.length} 条`;

            domRecordsList.innerHTML = allRecords.map(r => {
                const dateStr = r.play_date || '';
                const val = parseFloat(r.value) || 0;
                const colorClass = val >= 0 ? 'text-emerald-400' : 'text-red-400';
                const sign = val >= 0 ? '+' : '';
                return `
                <div class="flex items-center gap-3 px-4 py-3 border-b border-zinc-800/50 text-sm" id="row-${r.id}">
                    <span class="text-xs text-zinc-600 w-20 shrink-0 font-mono">${dateStr}</span>
                    <span class="text-zinc-200 font-medium truncate flex-1 min-w-0">${escHtml(r.player)}</span>
                    <span class="font-mono font-semibold shrink-0 text-right w-20 ${colorClass}">${sign}${val}分</span>
                </div>`;
            }).join('');
        }

        // ── Edit & Delete removed — recent records are read-only ──

        // ── Player Rows ──
        function createPlayerRow(name = '', value = '') {
            const div = document.createElement('div');
            div.className = 'flex items-center gap-2 w-full min-w-0';
            div.innerHTML = `
                <input type="text" placeholder="选手名" value="${escHtml(name)}"
                    class="player-name flex-1 min-w-0 box-border bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-zinc-200
                           focus:outline-none focus:border-zinc-600 transition-colors">
                <input type="number" placeholder="积分" value="${escHtml(value)}"
                    class="player-value w-20 shrink-0 box-border bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-zinc-200 text-right font-mono
                           focus:outline-none focus:border-zinc-600 transition-colors [-moz-appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                <button class="remove-row-btn shrink-0 w-9 h-9 flex items-center justify-center rounded-lg text-zinc-600 hover:text-red-400 hover:bg-red-950/30 transition-colors" title="移除">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>`;
            div.querySelector('.remove-row-btn').addEventListener('click', () => {
                div.remove();
                updateTotal();
            });
            return div;
        }

        function getPlayerRows() {
            const rows = [];
            domPlayerRows.querySelectorAll('.player-name').forEach((nameEl, i) => {
                const valEl = domPlayerRows.querySelectorAll('.player-value')[i];
                const name = (nameEl.value || '').trim();
                const valStr = (valEl.value || '').trim();
                if (name || valStr) {
                    rows.push({ name, value: parseFloat(valStr) });
                }
            });
            return rows;
        }

        // ── Real-time total calculator ──
        function updateTotal() {
            const rows = getPlayerRows();
            const total = rows.reduce((sum, r) => sum + (isNaN(r.value) ? 0 : r.value), 0);
            const sign = total >= 0 ? '+' : '';
            const colorClass = total >= 0 ? 'text-emerald-400' : 'text-red-400';
            domTotalValue.textContent = `${sign}${total}分`;
            domTotalValue.className = `font-mono text-sm font-semibold ${colorClass}`;
        }

        // Event delegation: recalculate total on input change
        domPlayerRows.addEventListener('input', (e) => {
            if (e.target.matches('.player-name, .player-value')) {
                updateTotal();
            }
        });

        domAddPlayerBtn.addEventListener('click', () => {
            domPlayerRows.appendChild(createPlayerRow());
            updateTotal();
            const names = domPlayerRows.querySelectorAll('.player-name');
            if (names.length > 0) names[names.length - 1].focus();
        });

        // ── Submit ──
        domSubmitBtn.addEventListener('click', async () => {
            const dateVal = domEntryDate.value;
            if (!dateVal) { showToast('请选择日期', 'error'); return; }

            const rows = getPlayerRows();
            if (rows.length === 0) { showToast('请至少添加一位选手', 'error'); return; }

            for (const r of rows) {
                if (!r.name) { showToast('请填写所有选手名', 'error'); return; }
                if (isNaN(r.value)) { showToast(`「${r.name}」积分无效`, 'error'); return; }
            }

            const existing = allRecords.filter(r => r.play_date === dateVal);
            const dupNames = rows.filter(r => existing.some(e => e.player === r.name)).map(r => r.name);
            if (dupNames.length > 0) {
                showToast(`「${dupNames.join('、')}」在 ${dateVal} 已有记录`, 'error');
                return;
            }

            domSubmitBtn.disabled = true;
            domSubmitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>提交中...';

            const { error } = await supabase.from(TABLE_NAME).insert(
                rows.map(r => ({ player: r.name, value: r.value, play_date: dateVal }))
            );

            domSubmitBtn.disabled = false;
            domSubmitBtn.innerHTML = '<i class="fa-solid fa-check mr-1.5"></i>一键提交';

            if (error) {
                showToast('提交失败: ' + error.message, 'error');
                return;
            }

            showToast(`成功录入 ${rows.length} 条记录`);
            domPlayerRows.innerHTML = '';
            for (let i = 0; i < 6; i++) domPlayerRows.appendChild(createPlayerRow());
            updateTotal();
            await fetchRecords();
        });

        // ── Enter key to submit login ──
        domLoginPassword.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') domLoginBtn.click();
        });

        // ── Init ──
        async function init() {
            initSupabase();

            // Check existing session
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                showAdminView(session.user);
            } else {
                showLoginView();
            }
        }

        function escHtml(str) {
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', init);
    })();

    // ── Theme Toggle ──
    (function() {
        const btn = document.getElementById('theme-toggle');
        const html = document.documentElement;
        const saved = localStorage.getItem('dp-theme') || 'light';
        html.setAttribute('data-theme', saved);
        if (btn) {
            btn.addEventListener('click', () => {
                const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                html.setAttribute('data-theme', next);
                localStorage.setItem('dp-theme', next);
            });
        }
    })();
    </script>
</body>
</html>
